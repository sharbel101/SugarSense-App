# Compress JSON responses (the Garmin history endpoints are ~100-160 KB of JSON each and travel through the ngrok tunnel).
# nginx.conf has `gzip on;` but its type list is commented out, so only text/html was ever compressed.
# Install: sudo cp deploy/nginx-gzip.conf /etc/nginx/conf.d/sugarsense-gzip.conf && sudo nginx -t && sudo systemctl reload nginx
# Remove:  sudo rm /etc/nginx/conf.d/sugarsense-gzip.conf && sudo nginx -t && sudo systemctl reload nginx
gzip_vary on;
gzip_proxied any;           # requests arrive through a tunnel agent / proxy headers
gzip_comp_level 5;
gzip_min_length 512;
gzip_types application/json text/plain text/css application/javascript;
